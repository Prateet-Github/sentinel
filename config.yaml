server:
  port: 8080

rate_limit:
  enabled: false
  capacity: 100
  refill_rate: 100

backends:
  - name: users-1
    service: users
    url: http://127.0.0.1:9000
    health_check_path: /health

  - name: users-2
    service: users
    url: http://127.0.0.1:9001
    health_check_path: /health

  - name: users-3
    service: users
    url: http://127.0.0.1:9002
    health_check_path: /health

routes:
  - method: GET
    path: /users
    backend: users

  - method: GET
    path: /users/profile
    backend: users

  - method: GET
    path: /users/settings
    backend: users

  - method: GET
    path: /users/orders
    backend: users

  - method: GET
    path: /orders
    backend: users

  - method: GET
    path: /orders/history
    backend: users

  - method: GET
    path: /products
    backend: users

  - method: GET
    path: /products/latest
    backend: users

  - method: GET
    path: /health
    backend: users

  - method: GET
    path: /users/:id
    backend: users

  - method: GET
    path: /files/*path
    backend: users